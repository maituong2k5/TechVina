name: Build TechVina Backend

on:
  push:
    branches:
      - master
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-techvina-backend
  cancel-in-progress: false

jobs:
  build:
    name: Build Spring Boot Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      # Bước 1: Lấy source code
      - name: Checkout source code
        uses: actions/checkout@v7

      # Bước 2: Cài đặt Java 21
      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      # Bước 3: Build Spring Boot bằng Maven
      - name: Build Backend
        run: mvn -B -ntp clean package -DskipTests

      # Bước 4: Kiểm tra file JAR
      - name: Verify JAR file
        run: test -s target/backend-0.0.1-SNAPSHOT.jar

      # Bước 5: Xác thực AWS bằng GitHub OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::560428233629:role/techvina-github-actions-backend-role
          aws-region: ap-southeast-1

      # Bước 6: Kiểm tra xác thực AWS
      - name: Verify AWS identity
        run: aws sts get-caller-identity
