name: Deploy TechVina Frontend

on:
  # Tự động chạy khi push thay đổi Frontend lên master
  push:
    branches:
      - master
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"

  # Cho phép chạy thủ công từ GitHub Actions
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-techvina-frontend
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      # Bước 1: Lấy mã nguồn từ GitHub
      - name: Checkout source code
        uses: actions/checkout@v7

      # Bước 2: Cài đặt Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Bước 3: Cài đặt thư viện
      - name: Install dependencies
        run: npm ci

      # Bước 4: Build React/Vite cho môi trường AWS
      - name: Build Frontend
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_AWS_REGION: ${{ vars.VITE_AWS_REGION }}
          VITE_COGNITO_USER_POOL_ID: ${{ vars.VITE_COGNITO_USER_POOL_ID }}
          VITE_COGNITO_CLIENT_ID: ${{ vars.VITE_COGNITO_CLIENT_ID }}
          VITE_COGNITO_DOMAIN: ${{ vars.VITE_COGNITO_DOMAIN }}
          VITE_COGNITO_REDIRECT_URI: ${{ vars.VITE_COGNITO_REDIRECT_URI }}
          VITE_COGNITO_LOGOUT_URI: ${{ vars.VITE_COGNITO_LOGOUT_URI }}
        run: npm run build

      # Bước 5: Xác thực AWS bằng GitHub OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::560428233629:role/techvina-github-actions-frontend-role
          aws-region: ap-southeast-1

      # Bước 6: Upload bản build lên S3
      - name: Deploy to Amazon S3
        run: |
          aws s3 sync dist/ s3://techvina-frontend-2026/ \
            --no-progress \
            --only-show-errors

      # Bước 7: Làm mới cache CloudFront
      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E3F9ZXOHLE2SXL \
            --paths "/*"
