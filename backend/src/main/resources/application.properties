# =================================
# Database Configuration - MySQL
# =================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# =================================
# Hibernate Configuration
# =================================

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
# Kiểm tra Entity có khớp cấu trúc Database hay không
spring.jpa.hibernate.ddl-auto=validate

# Hiển thị câu SQL Hibernate thực thi trong Console
spring.jpa.show-sql=true

# Hiển thị các API mapping mà Spring Boot đăng ký
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=TRACE

# ==========================================
# JWT CONFIGURATION
# ==========================================

# Thời hạn Access Token: 30 phút (đơn vị milliseconds)
jwt.expiration=1800000

# Refresh Token: 7 ngày
jwt.refresh-expiration=604800000

# Khóa bí mật JWT - sẽ được thay bằng biến môi trường khi triển khai AWS
jwt.secret=${JWT_SECRET}

# Hiển thị thông tin lỗi SQL và truy vấn Hibernate trong Console.
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE


# ==========================================
# Amazon Cognito Configuration
# ==========================================

# Địa chỉ User Pool phát hành JWT.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${COGNITO_ISSUER_URI}

# App Client ID của TechVina.
cognito.client-id=${COGNITO_CLIENT_ID}

# Domain Cognito dùng cho UserInfo.
cognito.domain=${COGNITO_DOMAIN}
